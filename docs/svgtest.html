<!DOCTYPE html>
<html>
<head>
<style>
body { background: #0d1b24; margin: 40px; }
.box { width: 300px; height: 180px; background: #162838; border: 1px solid #4fd1c5; overflow: hidden; }
.box img { width: 100%; height: 180px; object-fit: cover; display: block; }
</style>
</head>
<body>
<p style="color:white;">SVG as img tag:</p>
<div class="box">
  <img src="http://localhost:7432/assets/artgen/landscape-violet.svg" alt="test">
</div>
<p style="color:white; margin-top:20px;">Direct img with no CSS height:</p>
<div class="box">
  <img src="http://localhost:7432/assets/artgen/landscape-violet.svg" style="width:300px;" alt="test2">
</div>
<p style="color:white; margin-top:20px;">As background-image:</p>
<div class="box" style="background-image:url('http://localhost:7432/assets/artgen/landscape-violet.svg');background-size:cover;background-position:center;"></div>
</body>
</html>
