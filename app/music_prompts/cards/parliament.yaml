name: Parliament
aliases: [Parliament band]
family: funk
parent: p-funk
inspiration: [Parliament, Mothership Connection, Funkentelechy vs. the Placebo Syndrome, George Clinton]
sound: >-
  Polished, horn-driven space funk with tight brass riffs, bubbling synthesizer
