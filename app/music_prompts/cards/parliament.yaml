harmony: Dominant and minor seventh vamps with gospel-style vocal harmony.
mood: Theatrical, cosmic, joyful and cheeky.
production: Polished 1970s funk sound, horns and voices stacked wide, synth bass upfront.
tempo_bpm: [95, 115]
avoid: [fuzz guitar walls, sparse arrangements]
