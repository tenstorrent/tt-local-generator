id: bagpipes-on-the-beach-at-sunset
kind: scene
name: Bagpipes on the beach at sunset
aliases: [bag pipes on the beach at sunset, bagpipes on the beach, bag pipes on the beach, bagpipes at sunset, bag pipes, bagpipes, bagpipe, highland bagpipes, highland pipes]
family: scene
inspiration: []
sound: >-
  A lone Highland piper plays bagpipes on the beach at sunset, a slow air of
  buzzing drone and ornamented chanter melody carried over the waves and the sea
  breeze.
instruments: [Highland bagpipes]
rhythm: A free, slow air with long held notes, or an unhurried march.
harmony: A constant drone on the home note under a nine-note mixolydian chanter melody, decorated with grace notes.
mood: Proud, wistful, golden and wide open.
production: Outdoors and open, heard from a natural distance, with soft waves and wind beneath the pipes.
tempo_bpm: [60, 90]
avoid: [a full rock drum kit, dry studio sound]
tags: [highland bagpipes, drone, chanter melody, ocean waves, sunset, open air]
goes_with: [folk, post-rock, electronic]
clashes_with: [chip]
notes: >-
  Wikipedia: Great Highland bagpipe (chanter, two tenor drones and a bass drone,
  nine-note mixolydian scale, grace notes for articulation, slow airs and
  marches); mcnabbs.org: Introduction to Bagpipe Music (tune types, search
  summary); Bagpipemaster: lessons on grace notes (search summary). The beach
  and sunset are a free setting, and the tempo is my own estimate.
