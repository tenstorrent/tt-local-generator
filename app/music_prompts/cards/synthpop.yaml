id: synthpop
kind: style
name: Synthpop
aliases: [synth-pop, synth pop, 80s synthpop, 1980s synthpop]
family: pop
inspiration: [The Human League, Depeche Mode, Yazoo, Eurythmics, Pet Shop Boys]
sound: >-
  Bright, hook-filled 1980s pop on analog and early digital synths and drum
  machines, with punchy gated-reverb drums, catchy synth riffs and a singable
  chorus.
instruments: [analog synthesizers, digital synthesizer, drum machine, synth bass, sequencer]
rhythm: Steady, danceable drum-machine beats with a strong backbeat.
harmony: Simple, catchy major and minor progressions with a memorable top-line melody.
mood: Bright, bittersweet, danceable and romantic.
production: Glossy and compressed 1980s sound, gated-reverb drums, wide stereo synths.
tempo_bpm: [105, 135]
avoid: [acoustic folk instruments, long improvised solos]
tags: [synthpop, 1980s, analog synths, drum machine, gated reverb, catchy hooks]
goes_with: [electronic, funk]
notes: >-
  Wikipedia: Synth-pop (synthesizers, drum machines and sequencers; late 1970s
  origins, 1980s peak, three-minute pop structures); Wikipedia: Electropop
