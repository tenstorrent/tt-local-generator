id: lighthouse-at-dusk
kind: scene
name: Lighthouse at dusk
aliases: [a lighthouse at dusk, lighthouse at sunset, lighthouse at twilight, lighthouse foghorn, foghorn at dusk]
family: scene
inspiration: []
sound: >-
  A lighthouse at dusk on a rocky shore, a deep foghorn sounding slowly over
  rolling waves and calling gulls as the beam begins to turn.
instruments: [foghorn, ocean waves, seagulls, sea wind]
rhythm: Slow and spacious, a long horn blast at wide intervals with waves breaking in between.
mood: Lonely, calm, vast and wistful.
production: A wide open-air field recording with a long echo off the water.
avoid: [busy city noise, a dance beat]
tags: [lighthouse at dusk, foghorn, waves, seagulls, coastal, twilight]
goes_with: [ambient, post-rock, folk, chamber]
notes: >-
  Simon Fraser University World Soundscape Project: tape library, Point
  Atkinson and Point de Penmarc'h reels (a diaphone foghorn with seagulls,
  surf and a low rumble, search summary); Nova Scotia Lighthouse Preservation
  Society: Maritime sounds, foghorn recordings (search summary). The scene
  itself is a free setting.
