name: Yume Bitsu
aliases: [Yume-Bitsu]
family: post-rock
parent: post-rock
inspiration: [Yume Bitsu, Giant Surface Music Falling to Earth Like Jewels from the Sky, Golden Vessyl of Sound]
sound: >-
  Dreamy, swirling guitars soaked in delay drift over slow, rolling drums and
  warm keyboard drones, floating more than building in a hazy, psychedelic
  space-rock mood.
instruments: [delay-soaked electric guitars, keyboard drones, electronics, bass guitar, drum kit]
rhythm: Slow, rolling drums that keep a gentle pulse under long, free-floating passages.
harmony: Drones and a few slowly turning chords; colour comes from layered echoes.
mood: Dreamy, hazy, warm and weightless.
production: Washed in delay and reverb, soft edges, a home-recorded warmth.
tempo_bpm: [70, 115]
avoid: [crisp modern pop production, short songs with hooks]
vocal: soft, half-buried vocals set low in the mix
tags: [psychedelic post-rock, space rock, swirling guitars, delay, dreamy drone]
goes_with: [electronic, psych]
