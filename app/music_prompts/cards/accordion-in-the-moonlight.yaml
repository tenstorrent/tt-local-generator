id: accordion-in-the-moonlight
kind: scene
name: Accordion in the moonlight
aliases: [moonlit accordion, accordion by moonlight, accordion at night, accordion under the moon]
family: scene
inspiration: []
sound: >-
  A slow, swaying waltz played on a lone accordion in the moonlight, its bellows
  breathing between phrases, softly distant in the quiet night air.
instruments: [accordion]
rhythm: Slow waltz time in three, with gentle push and pull.
harmony: Simple major and minor folk chords from the bass buttons under a wistful melody.
mood: Wistful, tender, romantic and a little lonely.
production: Heard from a little distance, soft natural reverb, a quiet night-air hush.
tempo_bpm: [76, 96]
avoid: [a full drum kit, busy band arrangements, dry studio sound]
tags: [solo accordion, slow waltz, moonlit night, soft reverb, wistful, distant]
goes_with: [folk, post-rock, jazz]
clashes_with: [chip]
notes: >-
  Wikipedia: Accordion (bellows-driven free reeds, melody on the right hand,
  bass and chord buttons on the left, folk use); Wikipedia: Waltz (slow waltz,
  musette waltz); NPR: interview transcript on accordion playing (the bellows
  shape dynamics, search summary); accordions.com: dance tempos article (a slow
  waltz can go as slow as 28 bars a minute, search summary). The scene itself is
  a free setting.
