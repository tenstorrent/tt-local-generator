id: ash-ra-tempel
kind: artist
name: Ash Ra Tempel
aliases: [Ash Ra, Ash-Ra Tempel]
family: psych
parent: krautrock
inspiration: [Ash Ra Tempel, Manuel Göttsching, Klaus Schulze, Schwingungen, Join Inn]
sound: >-
  Long, improvised space rock, with an echo-soaked electric guitar spiralling
  over loose, rolling drums and droning bass, swelling into fuzz-heavy
  freak-outs and falling back to organ drones.
instruments: [echo-laden electric guitar, bass guitar, drum kit, organ, early synthesizers]
rhythm: Loose and free, building from a slow drift to a pounding jam and back.
harmony: Bluesy modal drones that stay on one centre for a long time.
mood: Cosmic, meditative, wild and searching.
production: Heavy echo and reverb, raw live-in-the-room sound, side-long pieces.
tempo_bpm: [70, 120]
avoid: [tight song structure, clean polished production]
tags: [space rock, cosmic jam, echo guitar, fuzz guitar, improvised, early electronics]
goes_with: [electronic, post-rock]
