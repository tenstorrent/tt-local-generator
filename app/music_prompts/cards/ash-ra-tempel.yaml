id: ash-ra-tempel
kind: artist
name: Ash Ra Tempel
aliases: [Ash Ra, Ash-Ra Tempel]
family: psych
parent: krautrock
inspiration: [Ash Ra Tempel, Manuel Göttsching, Klaus Schulze, Schwingungen, Join Inn]
sound: >-
  Long, improvised space rock, with an electric guitar soaked in delay
  spiralling over loose, rolling drums and a distorted bass, swelling into
  fuzz-heavy freak-outs and falling back to quiet electronic drones.
instruments: [delay-treated electric guitar, distorted bass guitar, drums and percussion, electronics]
rhythm: Loose and free, building from a slow drift to a pounding jam and back.
harmony: Bluesy modal drones that stay on one centre for a long time.
mood: Cosmic, meditative, wild and searching.
production: Heavy echo and reverb, raw live-in-the-room sound, side-long pieces.
tempo_bpm: [70, 120]
avoid: [tight song structure, clean polished production]
tags: [space rock, cosmic jam, echo guitar, fuzz guitar, improvised, early electronics]
goes_with: [electronic, post-rock]
notes: >-
  Wikipedia: Ash Ra Tempel (krautrock, space rock, kosmische, Göttsching on
  guitar, Schulze on drums and synthesisers); manuelgoettsching.com: Ash Ra
  Tempel 50th Anniversary Release Info (the 1971 debut credits Göttsching with
  electric guitar, vocals and electronics, Schulze with drums, percussion and
  electronics, search summary); Cambridge Companion to Krautrock: Ash Ra Tempel,
  Manuel Göttsching and Klaus Schulze (delay-treated guitar, Enke's distorted
  bass, search summary); Progarchives: Schwingungen reviews (search summary)
