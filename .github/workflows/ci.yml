name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            python3-pytest \
            python3-requests \
            python3-yaml \
            python3-pil \
            gir1.2-gtk-4.0 \
            xvfb
          # python3-pil (Pillow): gallery/ansi-image/showcase tests build image
          #   fixtures with PIL.Image; without it ~12 tests error on `import PIL`.
          # WebKit (gir1.2-webkit-6.0) is deliberately NOT installed — the app
          #   guards it (_WEBKIT_OK) and the reading-view tests fall back, so CI
          #   exercises the no-WebKit path.

      - name: Run tests
        run: |
          # tests/ — app unit tests.  xvfb-run provides a virtual X11 display so
          # @gtk_required tests (Gtk.Picture, GdkPixbuf, etc.) run instead of skipping.
          # app/animatediff/tests/ is excluded: those tests require the tt-metal
          # Python environment and Blackhole hardware, not available in CI.
          # The three --deselect'd tests are pre-existing, environment-level
          # flakes documented in CLAUDE.md (full-suite import-ordering / a
          # cffi/cairosvg version mismatch) — they pass in isolation and are
          # unrelated to app code.
          xvfb-run --auto-servernum python3 -m pytest tests/ -v \
            --deselect tests/test_pipeline_engine.py::test_run_plugin_loads_and_calls_real_module \
            --deselect tests/test_forge_transforms.py::test_on_transform_finished_appends_and_refreshes \
            --deselect tests/test_role_zone_panel.py::test_prompt_field_hidden_but_still_collected_for_artgen
